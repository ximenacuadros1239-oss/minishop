name: MiniShop CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: 1 - Descargar el código
        uses: actions/checkout@v4

      - name: 2 - Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 3 - Compilar
        run: mvn -B compile

      - name: 4 - Pruebas unitarias (Surefire)
        run: mvn -B test

      - name: 5 - Pruebas de integración y empaquetado (Failsafe)
        run: mvn -B verify -DskipUTs=true

      - name: 6 - Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: 7 - Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: minishop-jar
          path: target/*.jar

  release:
    name: Publicar versión
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el .jar
        run: mvn -B package -DskipTests

      - name: Crear la Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/*.jar --title "MiniShop $GITHUB_REF_NAME" --generate-notes